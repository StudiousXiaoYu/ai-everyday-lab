<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>日常计划 · 把想学的安排进生活</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/common.css" />
    <link rel="stylesheet" href="planner.css" />
    <script defer src="../assets/common.js"></script>
    <script defer src="planner.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到计划</a>
    <div class="wrap">
      <header class="site-header">
        <a class="wordmark" href="../index.html"
          ><span class="mark" aria-hidden="true"></span>我的小站</a
        >
        <nav class="site-nav" aria-label="示例应用">
          <a href="../index.html">个人网站</a
          ><a href="index.html" aria-current="page">日常计划</a
          ><a href="../knowledge/index.html">学习知识库</a>
        </nav>
        <span class="pill">一件一件，慢慢来</span>
      </header>
    </div>
    <div class="planner-shell">
      <aside class="planner-side">
        <a class="planner-brand" href="index.html"><span>◉</span> 日常计划</a>
        <div class="side-en">LITTLE BY LITTLE</div>
        <div class="side-current">▦　我的学习计划</div>
        <a class="side-link" href="../knowledge/index.html"
          >▤　去知识库看看 ↗</a
        >
        <div class="side-bottom">
          <div class="side-leaves" aria-hidden="true"><i></i><i></i></div>
          <p>不用一次学会所有。<br />每天开始一点点。</p>
        </div>
      </aside>
      <main id="main" class="planner-main">
        <div class="planner-top">
          <div class="eyebrow">MY PERSONAL SPACE</div>
          <span class="pill">数据只保存在本机</span>
        </div>
        <div class="planner-intro">
          <div>
            <h1>把想学的，<br class="mobile-br" />安排进生活。</h1>
            <p>一个自己的计划本，记录每一次小小的前进。</p>
          </div>
          <div class="plant" aria-hidden="true"><i></i><i></i></div>
        </div>
        <div class="week-toolbar">
          <button class="icon-button" id="prev-week" aria-label="上一周">
            ←</button
          ><span id="week-label"></span
          ><button class="icon-button" id="next-week" aria-label="下一周">
            →</button
          ><button class="text-button" id="today-button">回到今天</button>
        </div>
        <div class="week" id="week" aria-label="选择日期"></div>
        <div class="plan-columns">
          <section class="panel task-panel">
            <div class="panel-heading">
              <h2>今日小目标</h2>
              <span id="done-count"></span>
            </div>
            <div id="tasks"></div>
            <form id="add-form" class="add-form">
              <label class="sr-only" for="new-task">新任务</label
              ><input
                class="input"
                id="new-task"
                maxlength="100"
                placeholder="想做点什么？记下来…"
                required
              /><button class="btn small" type="submit">＋ 添加</button>
            </form>
            <div class="task-tip">不求排得满满当当，先做最值得做的一件。</div>
          </section>
          <div class="planner-right">
            <section class="progress-panel">
              <div class="eyebrow">每一步，都算数</div>
              <div class="progress-value">
                <span id="percent">0%</span><small>今日完成</small>
              </div>
              <div
                class="progress-track"
                role="progressbar"
                aria-label="所选日期任务完成度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <span id="progress-fill"></span>
              </div>
              <p id="encouragement"></p>
            </section>
            <section class="panel notes-panel">
              <div class="panel-heading">
                <h2>随手记</h2>
                <span>留给自己的话</span>
              </div>
              <label class="sr-only" for="notes">当天笔记</label
              ><textarea
                id="notes"
                placeholder="今天的新发现，或者留给明天的一个小提醒…"
                maxlength="20000"
              ></textarea>
              <p>一个想法，也可以是一个小小的行动。</p>
            </section>
          </div>
        </div>
        <div class="planner-bottom">
          <span id="save-status">● 自动保存到当前浏览器</span>
          <div class="btn-row">
            <button class="text-button" id="export-data">导出备份</button
            ><label
              class="text-button import-label"
              for="import-data"
              tabindex="0"
              role="button"
              >导入备份</label
            ><input
              type="file"
              id="import-data"
              accept=".json,application/json"
              hidden
            /><button class="text-button" id="reset-day">恢复当天示例</button>
          </div>
        </div>
      </main>
    </div>
    <div class="wrap">
      <footer class="site-footer">
        <span>你的记录只属于当前设备和浏览器，请定期导出备份。</span
        ><a href="../index.html">← 返回我的小站</a>
      </footer>
    </div>
    <dialog id="edit-task-dialog">
      <form id="edit-task-form">
        <div class="dialog-top">
          <h2>调整一下小目标</h2>
          <button
            class="icon-button"
            type="button"
            id="close-edit"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <label class="field" for="edit-task-input">任务内容</label
        ><input class="input" id="edit-task-input" maxlength="100" required />
        <div class="form-actions">
          <button class="btn" type="submit">保存修改</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
